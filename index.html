<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Conduit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    // Runs before first paint so a saved theme does not flash the other scheme
    // on the way in. The app reapplies it on mount from the same key.
    try {
      var t = localStorage.getItem('conduit.theme.v1');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* storage unavailable: fall back to the system preference */ }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
