# conduit-sandbox
# docker compose -f sandbox/docker-compose.yml up -d
# docker compose -f sandbox/docker-compose.yml down
# docker compose ls

name: conduit-sandbox

services:
  mongo:
    image: mongo:7
    container_name: conduit_mongo
    ports:
      - '27020:27017'   # mongodb://localhost:27020
    volumes:
      - conduit_mongo_data:/data/db
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: conduit_postgres
    ports:
      - '5433:5432'     # postgresql://conduit:conduit@localhost:5433/conduit
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit
    volumes:
      - conduit_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: conduit_mysql
    ports:
      - '3307:3306'     # mysql://root:conduit@localhost:3307/conduit
    environment:
      MYSQL_ROOT_PASSWORD: conduit
      MYSQL_DATABASE: conduit
    volumes:
      - conduit_mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: conduit_redis
    ports:
      - '6381:6379'     # redis://localhost:6381
    volumes:
      - conduit_redis_data:/data
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: conduit_clickhouse
    ports:
      - '8125:8123'     # http://localhost:8125
      - '9001:9000'     # native tcp
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - conduit_ch_data:/var/lib/clickhouse
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7
    container_name: conduit_kafka
    ports:
      - '9094:9092'
    environment:
      KAFKA_CFG_NODE_ID: '0'
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@conduit_kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    volumes:
      - conduit_kafka_data:/bitnami/kafka
    restart: unless-stopped

volumes:
  conduit_mongo_data:
  conduit_pg_data:
  conduit_mysql_data:
  conduit_redis_data:
  conduit_ch_data:
  conduit_kafka_data:
