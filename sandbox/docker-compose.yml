# conduit-sandbox
# docker compose -f sandbox/docker-compose.yml up -d
# docker compose -f sandbox/docker-compose.yml down
# docker compose ls

name: conduit-sandbox

services:
  mongo:
    image: mongo:7
    container_name: conduit_mongo
    ports:
      - '27020:27017'   # mongodb://localhost:27020
    volumes:
      - conduit_mongo_data:/data/db
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: conduit_postgres
    ports:
      - '5433:5432'     # postgresql://conduit:conduit@localhost:5433/conduit
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit
    volumes:
      - conduit_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: conduit_mysql
    ports:
      - '3307:3306'     # mysql://root:conduit@localhost:3307/conduit
    environment:
      MYSQL_ROOT_PASSWORD: conduit
      MYSQL_DATABASE: conduit
    volumes:
      - conduit_mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: conduit_redis
    ports:
      - '6381:6379'     # redis://localhost:6381
    volumes:
      - conduit_redis_data:/data
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: conduit_clickhouse
    ports:
      - '8125:8123'     # http://localhost:8125
      - '9001:9000'     # native tcp
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - conduit_ch_data:/var/lib/clickhouse
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    container_name: conduit_kafka
    ports:
      - '9094:9092'
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
    volumes:
      - conduit_kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  pulsar:
    image: apachepulsar/pulsar:3.3.0
    container_name: conduit_pulsar
    command: bin/pulsar standalone
    ports:
      - '6650:6650'
      - '8080:8080'
    volumes:
      - conduit_pulsar_data:/pulsar/data
    restart: unless-stopped

  grpcbin:
    image: moul/grpcbin
    container_name: conduit_grpcbin
    platform: linux/amd64
    ports:
      - '9000:9000'
    restart: unless-stopped

volumes:
  conduit_mongo_data:
  conduit_pg_data:
  conduit_mysql_data:
  conduit_redis_data:
  conduit_ch_data:
  conduit_pulsar_data:
  conduit_kafka_data:
